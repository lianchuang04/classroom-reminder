name: 每日课表提醒

on:
 schedule:
      # 北京时间 0:00 (UTC 16:00) — 主触发
      - cron: '0 16 * * *'
      # 北京时间 0:30 (UTC 16:30) — 备份触发
      - cron: '30 16 * * *'
    workflow_dispatch:  # 支持手动触发

  jobs:
    remind:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4

        - name: 设置 Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 20

        - name: 安装依赖
          run: npm install

        - name: 判断今天是否有课并防重复
          id: check-day
          run: |
            TODAY=$(TZ='Asia/Shanghai' date +%Y%m%d)
            DAY=$(TZ='Asia/Shanghai' date +%u)

            SENT_FILE="/tmp/reminder-sent-${TODAY}"
            if [ -f "$SENT_FILE" ]; then
              echo "📅 今天已发送过提醒，跳过"
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            touch "$SENT_FILE"

            echo "day=$DAY" >> $GITHUB_OUTPUT
            if [ "$DAY" -ge 5 ]; then
              echo "📅 今天是周$DAY，没有课，跳过推送"
            else
              echo "📅 今天是周$DAY，有课，准备推送"
            fi

        - name: 发送课表提醒
          if: steps.check-day.outputs.day < 5
          run: node src/index.js
          env:
            SERVER_CHAN_KEY: ${{ secrets.SERVER_CHAN_KEY }}
